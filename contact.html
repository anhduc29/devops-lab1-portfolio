<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Lab 1 — Contact</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .nav { margin-bottom: 24px; }
        .nav a { 
            margin: 0 8px; 
            text-decoration: none; 
            color: #667eea; 
            font-weight: bold; 
            padding: 6px 12px; 
            border-radius: 8px;
            transition: background 0.3s;
        }
        .nav a:hover { background: #f8f9fa; }
        .container {
            background: white;
            border-radius: 16px;
            padding: 48px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 { color: #667eea; margin-bottom: 8px; font-size: 32px; }
        h2 { color: #764ba2; margin-bottom: 24px; font-size: 18px; font-weight: normal; }
        .info { background: #f8f9fa; border-radius: 8px; padding: 20px; margin: 16px 0; text-align: left; }
        .info p { margin: 8px 0; }
        .footer { margin-top: 24px; font-size: 13px; color: #999; }
        .avatar { 
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            object-fit: cover; 
            margin-bottom: 16px; 
            border: 4px solid #f8f9fa;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">

        <img src="avatar.jpg" alt="Ảnh đại diện" class="avatar">
   
        <h1> Thông tin liên hệ</h1>
        <h2>Kết nối với tôi</h2>

        <div class="nav">
            <a href="index.html">Trang chủ</a>
            <a href="about.html">Giới thiệu</a>
            <a href="contact.html">Liên hệ</a>
        </div>

        <div class="info">
            <p> <strong>Địa chỉ:</strong> Thành phố Thái Nguyên, Việt Nam</p>
            <p> <strong>Email:</strong> (Điền email của bạn vào đây)</p>
            <p> <strong>GitHub:</strong> github.com/Tên_GitHub_Của_Bạn</p>
        </div>
        
        <div class="footer">
            <p>Deployed automatically via GitHub Actions Pipeline</p>
        </div>
    </div>
</body>
</html>
