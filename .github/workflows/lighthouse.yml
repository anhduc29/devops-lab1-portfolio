name: Lighthouse CI
on:
  push:
    branches: [main]
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit web performance
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://anhduc29.github.io/devops-lab1-portfolio/
          temporaryPublicStorage: true